service:
  name: keeping-serverless-user-api

plugins:
  - serverless-offline

provider:
  name: aws
  runtime: nodejs14.x
  stage: prod
  memorySize: 2048
  timeout: 10
  lambdaHashingVersion: "20201221"
  region: ap-northeast-2

functions:
  main:
    handler: dist/lambda.handler
    events:
      - http:
          method: ANY
          path: /
      - http:
          method: ANY
          path: '{proxy+}'
