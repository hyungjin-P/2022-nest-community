service:
  name: keeping-serverless-user-api

useDotenv: true

plugins:
  - serverless-offline
  - serverless-dotenv-plugin

provider:
  name: aws
  runtime: nodejs14.x
  stage: prod
  memorySize: 2048
  timeout: 10
  lambdaHashingVersion: "20201221"
  region: ap-northeast-2
  apiGateway:
    shouldStartNameWithService: true
  vpc:
    securityGroupIds:
      - sg-REDACTED_2
    subnetIds:
      - subnet-REDACTED_5
      - subnet-REDACTED_6

functions:
  main:
    handler: dist/lambda.handler
    events:
      - http:
          method: ANY
          path: /
      - http:
          method: ANY
          path: '{proxy+}'

custom:
  optimize:
    external: ['swagger-ui-dist']
